<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P2P Energy Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0F1417; --panel:#161D22; --panel-alt:#1B2329; --border:#2A343D;
    --text:#E7EDEF; --text-dim:#8B98A0; --text-faint:#5B666D;
    --produce:#49C9B0; --consume:#E2A339; --ops:#5B8DEF; --warn:#E1573F; --ok:#49C97A;
    --battery:#8B7FE8;
    --font-ui:'IBM Plex Sans',system-ui,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);height:100%;}
  body{display:flex;height:100vh;overflow:hidden;}
  h1,h2,h3{font-weight:600;margin:0;}
  .mono{font-family:var(--font-mono);}
  a{color:var(--ops);}
  button{cursor:pointer;font-family:var(--font-ui);font-size:12.5px;font-weight:500;border-radius:5px;border:1px solid var(--border);background:var(--panel-alt);color:var(--text);padding:8px 12px;transition:background .12s;}
  button:hover{background:#232D34;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button.primary{background:var(--ops);border-color:var(--ops);color:#0B1116;font-weight:600;}
  button.primary:hover{background:#6d9bf5;}
  button.block{width:100%;}
  input,select{background:var(--panel-alt);border:1px solid var(--border);color:var(--text);padding:7px 8px;border-radius:5px;font-family:var(--font-mono);font-size:12.5px;}
  input.full,select.full{width:100%;}
  label.f{display:block;font-size:11px;color:var(--text-dim);margin:8px 0 4px;}

  /* ── Layout ───────────────────────────────────────────── */
  .sidebar{width:260px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;height:100vh;overflow-y:auto;padding:16px 14px;}
  .main{flex:1;overflow-y:auto;padding:26px 30px 60px;}
  .brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin-bottom:18px;padding:0 2px;}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--produce);}

  .side-section{border-top:1px solid var(--border);padding-top:12px;margin-top:12px;}
  .side-section:first-of-type{border-top:none;margin-top:0;padding-top:0;}
  .side-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-faint);margin-bottom:8px;}

  .profile-card{background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:4px;}
  .role-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:3px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;margin-bottom:6px;}
  .role-badge.owner{background:rgba(91,141,239,.18);color:var(--ops);}
  .role-badge.household{background:rgba(73,201,176,.18);color:var(--produce);}
  .profile-addr{font-size:11.5px;word-break:break-all;}

  .nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:6px;cursor:pointer;
    color:var(--text-dim);font-size:13px;margin-bottom:2px;user-select:none;}
  .nav-item:hover{background:var(--panel-alt);}
  .nav-item.active{background:var(--panel-alt);color:var(--text);box-shadow:inset 3px 0 0 var(--ops);}

  .hh-list{max-height:220px;overflow-y:auto;}
  .hh-item{padding:7px 10px;border-radius:5px;cursor:pointer;font-size:12px;font-family:var(--font-mono);
    color:var(--text-dim);margin-bottom:2px;}
  .hh-item:hover{background:var(--panel-alt);}
  .hh-item.active{background:var(--panel-alt);color:var(--text);box-shadow:inset 3px 0 0 var(--produce);}

  details.settings summary{cursor:pointer;font-size:11px;color:var(--text-faint);list-style:none;padding:4px 0;}
  details.settings summary::-webkit-details-marker{display:none;}
  details.settings[open] summary{color:var(--text-dim);}
  .settings-body{padding-top:8px;}
  .settings-body label.f{margin:6px 0 3px;}

  .status-line{font-size:10.5px;color:var(--text-faint);margin-top:10px;line-height:1.5;}
  .status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;background:var(--text-faint);}
  .status-dot.on{background:var(--ok);}
  .status-dot.warn{background:var(--warn);}

  /* ── Main content ─────────────────────────────────────── */
  .page-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px;flex-wrap:wrap;gap:8px;}
  .page-header h1{font-size:19px;}
  .page-header .sub{font-size:12px;color:var(--text-dim);}

  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
  .kpi-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 16px;}
  .kpi-card .v{font-family:var(--font-mono);font-size:23px;font-weight:600;}
  .kpi-card .v.warn{color:var(--warn);} .kpi-card .v.ok{color:var(--ok);}
  .kpi-card .l{font-size:11px;color:var(--text-dim);margin-top:4px;}

  .section{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:18px;margin-bottom:18px;}
  .section h2{font-size:13.5px;display:flex;align-items:center;gap:7px;}
  .section .desc{font-size:11.5px;color:var(--text-dim);margin:3px 0 14px;}
  .section-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:900px){ .section-row{grid-template-columns:1fr;} .sidebar{width:210px;} }

  .empty{color:var(--text-faint);font-size:12.5px;padding:10px 0;}
  .err{color:var(--warn);font-size:12px;background:rgba(225,87,63,.08);border:1px solid rgba(225,87,63,.3);padding:8px 10px;border-radius:5px;margin-top:6px;}
  .ok-msg{color:var(--ok);font-size:12px;background:rgba(73,201,122,.08);border:1px solid rgba(73,201,122,.3);padding:8px 10px;border-radius:5px;margin-top:6px;}
  .warn-msg{color:var(--warn);font-size:11.5px;background:rgba(225,87,63,.06);border:1px solid rgba(225,87,63,.25);padding:8px 10px;border-radius:5px;margin:8px 0;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--text-faint);font-weight:500;font-size:11px;padding:0 8px 6px 0;border-bottom:1px solid var(--border);}
  td{padding:6px 8px 6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-family:var(--font-mono);}
  tr:last-child td{border-bottom:none;}
  .tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:3px;font-family:var(--font-ui);}
  .tag.yes{background:rgba(73,201,176,.15);color:var(--produce);}
  .tag.no{background:rgba(225,87,63,.15);color:var(--warn);}
  .addr-link{color:var(--text);text-decoration:none;border-bottom:1px dotted var(--text-faint);}
  .addr-link:hover{color:var(--ops);border-bottom-color:var(--ops);}
  .scroll-y{max-height:320px;overflow-y:auto;}
  canvas{max-width:100%;}

  .admin-block{border-top:1px solid var(--border);padding-top:12px;margin-top:12px;}
  .admin-block:first-child{border-top:none;padding-top:0;margin-top:0;}
  .admin-block .row{display:flex;gap:8px;margin-top:8px;}
  .admin-block input{flex:1;}
  .admin-block p{font-size:11.5px;color:var(--text-dim);margin:0;}

  .login-box .row{display:flex;gap:6px;margin-top:6px;}
  .login-box input{flex:1;}
  .pk-toggle{font-size:11px;color:var(--text-faint);cursor:pointer;text-decoration:underline;margin-top:8px;display:inline-block;}

  /* ── Batterie-Visual ─────────────────────────────────── */
  .battery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
  .battery-card{background:var(--panel-alt);border:1px solid var(--border);border-radius:6px;padding:10px;text-align:center;}
  .battery-card .addr-link{font-size:11px;display:block;margin-bottom:8px;}
  .battery-shell{position:relative;width:56px;height:104px;margin:0 auto 8px;border:2px solid var(--text-dim);border-radius:5px;overflow:hidden;background:#0B1116;}
  .battery-shell::before{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:20px;height:6px;background:var(--text-dim);border-radius:2px 2px 0 0;}
  .battery-fill{position:absolute;bottom:0;left:0;width:100%;transition:height .6s ease, background .6s ease;}
  .battery-fill.lvl-low{background:linear-gradient(180deg,#ff8a75,var(--warn));}
  .battery-fill.lvl-mid{background:linear-gradient(180deg,#ffd27a,var(--consume));}
  .battery-fill.lvl-high{background:linear-gradient(180deg,#7ee9d6,var(--produce));}
  .battery-fill.charging{animation:pulseFill 1.4s ease-in-out infinite;}
  @keyframes pulseFill{ 0%,100%{filter:brightness(1);} 50%{filter:brightness(1.35);} }
  .battery-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:13px;font-weight:600;color:#0B1116;mix-blend-mode:screen;text-shadow:0 0 3px rgba(0,0,0,.4);}
  .battery-bolt{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:13px;line-height:14px;opacity:0;}
  .battery-bolt.show-charge, .battery-bolt.show-discharge{opacity:1;animation:boltFlicker 1.1s ease-in-out infinite;}
  @keyframes boltFlicker{ 0%,100%{opacity:.35;} 50%{opacity:1;} }
  .battery-status-label{font-size:10.5px;color:var(--text-dim);}
  .battery-status-label.charge{color:var(--produce);} .battery-status-label.discharge{color:var(--consume);}
  .battery-meta-row{display:flex;justify-content:space-between;font-size:10px;color:var(--text-faint);margin-top:4px;font-family:var(--font-mono);}

  .flow-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-dim);margin-bottom:10px;}
  .flow-legend span{display:inline-flex;align-items:center;gap:5px;}
  .swatch{width:10px;height:10px;border-radius:2px;display:inline-block;}
</style>
</head>
<body>

<div class="sidebar" id="sidebar"></div>
<div class="main" id="main"></div>

<script>
/* ════════════════════════════════════════════════════════════════
   ABIs
   ════════════════════════════════════════════════════════════════ */
const ORACLE_ABI = [
  "function getCurrentSlot() view returns (uint256)",
  "function isHouseholdRegistered(address) view returns (bool)",
  "function startTimestamp() view returns (uint256)",
  "function owner() view returns (address)",
  "function authorizeOracle(address oracle)",
  "event HouseholdRegistered(address indexed household)",
  "event MeterUpdated(address indexed household, uint256 slot, uint256 consumption, uint256 production)",
  "event BatteryUpdated(address indexed household, uint256 slot, uint256 soc)"
];

const MARKET_ABI = [
  "function getAllHouseholds() view returns (address[])",
  "function isRegistered(address) view returns (bool)",
  "function energyPricePerKwh() view returns (uint256)",
  "function lastSettledSlot() view returns (uint256)",
  "function owner() view returns (address)",
  "function settleSlot()",
  "function setEnergyPrice(uint256)",
  "function registerHousehold(address)",
  "function setBatteryManager(address)",
  "function setIncentiveController(address)",
  "event HouseholdRegistered(address indexed household)",
  "event EnergyTraded(address indexed producer, address indexed consumer, uint256 energyWh, uint256 amountPaid, uint256 slot)",
  "event SlotSettled(uint256 indexed slot, uint256 totalEnergyTraded, uint256 totalPaid)"
];

const BATTERY_ABI = [
  "function addHousehold(address)",
  "function isManaged(address) view returns (bool)",
  "function getManagedHouseholds() view returns (address[])",
  "function getBatteryStatus(address) view returns (uint256 soc, uint256 capacity, uint256 reserveSoc, uint256 charged, uint256 discharged)",
  "function totalChargedWh(address) view returns (uint256)",
  "function totalDischargedWh(address) view returns (uint256)",
  "function MAX_SOC() view returns (uint256)",
  "function RESERVE_SOC_CLOUDY() view returns (uint256)",
  "function previewAction(address) view returns (uint8 action, uint256 amountWh, string reason)",
  "event DecisionMade(address indexed household, uint8 action, uint256 amountWh, uint256 slot, string reason)"
];

const INCENTIVE_ABI = [
  "function owner() view returns (address)",
  "function getReputationScore(address household) view returns (uint256)",
  "function getPriceMultiplier(address household) view returns (uint256)",
  "function forecasts(address,uint256) view returns (uint256 expectedConsumptionWh, uint256 expectedProductionWh, uint256 slot, uint256 timestamp)",
  "function actuals(address,uint256) view returns (uint256 actualConsumptionWh, uint256 actualProductionWh, uint256 slot)",
  "event ForecastSubmitted(address indexed household, uint256 slot, uint256 expectedConsumption)",
  "event ActualSubmitted(address indexed household, uint256 slot, uint256 actualConsumption)",
  "event ScoreUpdated(address indexed household, uint256 newScore, uint256 deviation)"
];
// Bekannte Konstanten aus IncentiveController.sol (public constant, ändern sich nicht) —
// direkt übernommen statt on-chain abgefragt, da als "public constant" ohnehin fix.
const INCENTIVE_BASE_MULTIPLIER = 1000; // 1000 = neutraler Preis (0% Rabatt/Aufschlag)

const ERC20_ABI = [
  "function approve(address spender, uint256 amount) returns (bool)",
  "function allowance(address owner, address spender) view returns (uint256)"
];

const BIG_NUMBER = (2n ** 256n) - 1n;

// 1 Slot = 1 reale Minute = 15 Sim-Minuten -> 3600/15 = 240 reale Sekunden pro Sim-Stunde.
// Simulierte Zeit wird aus ECHTEN Block-Timestamps rekonstruiert (nicht aus Slot-Zählung
// oder einer angenommenen fixen Rate pro Event), verankert bei 06:00 am ersten geladenen
// Datenpunkt -- das bildet reale Verzögerungen zwischen push_slot()-Durchläufen korrekt ab.
const REAL_SECONDS_PER_SIM_HOUR = 240;
const SIM_START_MINUTES = 6 * 60; // 06:00, fix (siehe oracle_writer.py-Fix)

/* ════════════════════════════════════════════════════════════════
   STATE
   ════════════════════════════════════════════════════════════════ */
const state = {
  provider: null, oracle: null, market: null, battery: null, incentive: null,
  signer: null, myAddress: null, role: 'none', // 'none' | 'owner' | 'household' | 'unknown'
  marketWithSigner: null, oracleWithSigner: null, batteryWithSigner: null,
  connected: false,
  logs: null, households: [], batteryHouseholds: [],
  blockTimestamps: {}, firstBlockTs: null, timeRangeDays: 'all',
  page: 'overview', viewAddress: 'all',
  charts: {}
};

function short(addr){ return addr ? addr.slice(0,6)+"…"+addr.slice(-4) : "–"; }
function addrLink(addr){ return addr ? `<a class="addr-link" href="https://sepolia.etherscan.io/address/${addr}" target="_blank" rel="noopener">${short(addr)}</a>` : "–"; }
function fmtToken(units){ return (Number(units) / 1e6).toLocaleString('de-CH',{maximumFractionDigits:4}); }
function fmtKwh(wh){ return (Number(wh) / 1000).toLocaleString('de-CH',{maximumFractionDigits:3}); }
function fmtTime(ts){ return ts ? new Date(Number(ts)*1000).toLocaleString('de-CH',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}) : ''; }
function norm(addr){ try{ return ethers.getAddress(addr); }catch(e){ return addr; } }

// Kleine, lizenzfreie Strich-Icons (kein Emoji, keine externe Icon-Bibliothek nötig).
const ICON_PATHS = {
  grid: '<rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/>',
  sliders: '<line x1="2" y1="4" x2="14" y2="4"/><circle cx="6" cy="4" r="1.6"/><line x1="2" y1="8" x2="14" y2="8"/><circle cx="10" cy="8" r="1.6"/><line x1="2" y1="12" x2="14" y2="12"/><circle cx="5" cy="12" r="1.6"/>',
  zap: '<polygon points="8,1 3,9 7,9 6,15 13,6 9,6"/>',
  battery: '<rect x="1" y="4" width="11" height="8" rx="1.5"/><rect x="13" y="6.5" width="2" height="3" rx="0.5"/>',
  chart: '<polyline points="1,13 5,8 8,10 15,2"/><line x1="1" y1="15" x2="15" y2="15"/>',
  card: '<rect x="1" y="3" width="14" height="10" rx="1.5"/><line x1="1" y1="6.5" x2="15" y2="6.5"/>',
  unlock: '<rect x="3" y="7" width="10" height="7" rx="1.2"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0"/>',
  pulse: '<polyline points="1,8 4,8 6,3 9,13 11,8 15,8"/>',
  link: '<path d="M6.5 9.5 9.5 6.5"/><path d="M7 4l1.5-1.5a2.6 2.6 0 0 1 3.7 3.7L11 7.5"/><path d="M9 12l-1.5 1.5a2.6 2.6 0 0 1-3.7-3.7L5 8.5"/>',
  home: '<path d="M2 7.5 8 2l6 5.5"/><path d="M3.5 6.5V14h9V6.5"/>',
  tool: '<path d="M10.5 5.5 12 4a3 3 0 0 0-4-4l-1.3 1.3M5.5 10.5 4 12a3 3 0 0 0 4 4l1.3-1.3"/><line x1="2" y1="14" x2="10" y2="6"/>',
  info: '<circle cx="8" cy="8" r="6.5"/><line x1="8" y1="7" x2="8" y2="11.5"/><circle cx="8" cy="4.7" r="0.15" fill="currentColor" stroke-width="1.4"/>',
  down: '<line x1="8" y1="2" x2="8" y2="12"/><polyline points="4,8 8,13 12,8"/>',
};
function icon(name, size){
  size = size || 14;
  return `<svg width="${size}" height="${size}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;">${ICON_PATHS[name]||''}</svg>`;
}

function simTimeLabel(blockTs){
  if(!blockTs || !state.firstBlockTs) return '–:–';
  const elapsedReal = blockTs - state.firstBlockTs;
  const elapsedSimMin = (elapsedReal / REAL_SECONDS_PER_SIM_HOUR) * 60;
  const raw = SIM_START_MINUTES + elapsedSimMin;
  const totalMin = ((Math.round(raw) % 1440) + 1440) % 1440;
  const h = Math.floor(totalMin/60), m = totalMin%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}

/* ════════════════════════════════════════════════════════════════
   SIDEBAR
   ════════════════════════════════════════════════════════════════ */
function renderSidebar(){
  const el = document.getElementById('sidebar');
  let html = `<div class="brand"><span class="dot"></span> P2P Energy</div>`;

  if(!state.connected){
    html += `
      <div class="side-section">
        <div class="side-label">Verbindung</div>
        <button class="primary block" id="btnConnect">Verbinden</button>
        <div id="connectStatus" style="margin-top:8px;"></div>
        <details class="settings" style="margin-top:10px;">
          <summary>Einstellungen anzeigen</summary>
          <div class="settings-body">
            <label class="f">RPC URL</label>
            <input class="full" id="cfgRpc" value="https://ethereum-sepolia-rpc.publicnode.com">
            <label class="f">OracleStorage</label>
            <input class="full" id="cfgOracle" value="0xD67f5d8CF4338FeFB65A43B581880CA65A6eC3eB">
            <label class="f">P2PEnergyMarket</label>
            <input class="full" id="cfgMarket" value="0xbA9807E2A47566Eaa863A3f3EffAaAC3DFc54404">
            <label class="f">BatteryManager (optional)</label>
            <input class="full" id="cfgBattery" value="0xad8bfCa01391F8E45b15d74874abf9420b581da8">
            <label class="f">IncentiveController (optional)</label>
            <input class="full" id="cfgIncentive" value="0x205D53728DF46bf3b5e64ADCfb4e55032BAd1547">
            <label class="f">Ab Block</label>
            <input class="full" id="cfgFromBlock" value="11675505">
          </div>
        </details>
      </div>`;
    el.innerHTML = html;
    document.getElementById('btnConnect').addEventListener('click', doConnect);
    return;
  }

  if(state.role === 'none'){
    html += `
      <div class="side-section login-box">
        <div class="side-label">Login</div>
        <button class="primary block" id="btnWalletLogin">Mit Wallet verbinden</button>
        <span class="pk-toggle" id="togglePk">...oder mit Private Key</span>
        <div id="pkForm" style="display:none;">
          <div class="warn-msg" style="margin-top:8px;">⚠️ Nur für Test-Wallets ohne echten Wert. Der Key verlässt diesen Browser nie (bleibt im Seitenspeicher), ist aber grundsätzlich riskant, ihn überhaupt einzutippen.</div>
          <input class="full" id="pkInput" type="password" placeholder="0x... (Private Key)">
          <button class="block" id="btnPkLogin" style="margin-top:6px;">Einloggen</button>
        </div>
        <div id="loginError"></div>
      </div>`;
  } else {
    const badgeClass = state.role==='owner' ? 'owner' : state.role==='household' ? 'household' : '';
    const badgeText = state.role==='owner' ? 'Owner' : state.role==='household' ? 'Haushalt' : 'Unbekannt';
    html += `
      <div class="side-section">
        <div class="profile-card">
          <span class="role-badge ${badgeClass}">${badgeText}</span>
          <div class="profile-addr">${addrLink(state.myAddress)}</div>
        </div>
        <button class="block" id="btnLogout" style="margin-top:8px;">Logout</button>
      </div>`;

    if(state.role === 'unknown'){
      html += `<div class="side-section"><div class="warn-msg">Diese Adresse ist weder Owner noch als Haushalt im Market registriert. Bitte beim Owner registrieren lassen oder anderes Wallet nutzen.</div></div>`;
    }

    if(state.role === 'owner'){
      html += `
        <div class="side-section">
          <div class="side-label">Navigation</div>
          <div class="nav-item ${state.page==='overview'?'active':''}" data-page="overview">${icon('grid')} Übersicht</div>
          <div class="nav-item ${state.page==='management'?'active':''}" data-page="management">${icon('sliders')} Verwaltung</div>
        </div>`;
      if(state.page === 'overview'){
        html += `
          <div class="side-section">
            <div class="side-label">Haushalt auswählen</div>
            <div class="hh-list" id="hhList">
              <div class="hh-item ${state.viewAddress==='all'?'active':''}" data-addr="all">Alle Haushalte</div>
              ${state.households.map(a=>`<div class="hh-item ${norm(state.viewAddress)===norm(a)?'active':''}" data-addr="${a}">${short(a)}</div>`).join('')}
            </div>
          </div>`;
      }
    }
  }

  html += `
    <div style="flex:1;"></div>
    <div class="side-section">
      <button class="block" id="btnRefresh" ${state.connected?'':'disabled'}>↻ Aktualisieren</button>
      <div class="status-line" id="lastFetchInfo">Noch keine Daten geladen.</div>
    </div>`;

  el.innerHTML = html;

  const btnRefresh = document.getElementById('btnRefresh');
  if(btnRefresh) btnRefresh.addEventListener('click', refreshAll);

  const btnWalletLogin = document.getElementById('btnWalletLogin');
  if(btnWalletLogin) btnWalletLogin.addEventListener('click', loginWithWallet);

  const togglePk = document.getElementById('togglePk');
  if(togglePk) togglePk.addEventListener('click', ()=>{
    const f = document.getElementById('pkForm');
    f.style.display = f.style.display==='none' ? 'block' : 'none';
  });
  const btnPkLogin = document.getElementById('btnPkLogin');
  if(btnPkLogin) btnPkLogin.addEventListener('click', ()=> loginWithPrivateKey(document.getElementById('pkInput').value.trim()));

  const btnLogout = document.getElementById('btnLogout');
  if(btnLogout) btnLogout.addEventListener('click', logout);

  el.querySelectorAll('.nav-item[data-page]').forEach(item=>{
    item.addEventListener('click', ()=>{ state.page = item.dataset.page; renderSidebar(); renderMain(); });
  });
  el.querySelectorAll('.hh-item[data-addr]').forEach(item=>{
    item.addEventListener('click', ()=>{ state.viewAddress = item.dataset.addr; renderSidebar(); renderMain(); });
  });
}

async function doConnect(){
  const rpc = document.getElementById('cfgRpc').value.trim();
  const oracleAddr = document.getElementById('cfgOracle').value.trim();
  const marketAddr = document.getElementById('cfgMarket').value.trim();
  const batteryAddr = document.getElementById('cfgBattery').value.trim();
  const statusEl = document.getElementById('connectStatus');
  const btn = document.getElementById('btnConnect');
  if(!rpc || !oracleAddr || !marketAddr){ statusEl.innerHTML = '<div class="err">RPC, OracleStorage- und P2PEnergyMarket-Adresse benötigt.</div>'; return; }
  btn.disabled = true; btn.textContent = 'Verbinde…';
  statusEl.innerHTML = '<div class="empty">Stelle Verbindung her…</div>';
  try{
    state.provider = new ethers.JsonRpcProvider(rpc);
    await state.provider.getBlockNumber();
    state.oracle = new ethers.Contract(oracleAddr, ORACLE_ABI, state.provider);
    state.market = new ethers.Contract(marketAddr, MARKET_ABI, state.provider);
    state.battery = batteryAddr ? new ethers.Contract(batteryAddr, BATTERY_ABI, state.provider) : null;
    const incentiveAddr = document.getElementById('cfgIncentive').value.trim();
    state.incentive = incentiveAddr ? new ethers.Contract(incentiveAddr, INCENTIVE_ABI, state.provider) : null;
    state.connected = true;
    statusEl.innerHTML = '<div class="empty">Lade Daten…</div>';
    await refreshAll();
    renderSidebar();
  }catch(err){
    console.error(err);
    btn.disabled = false; btn.textContent = 'Verbinden';
    statusEl.innerHTML = `<div class="err">Verbindung fehlgeschlagen: ${err.message||err}</div>`;
  }
}

async function detectRole(address){
  try{
    const owner = await state.market.owner();
    if(norm(owner) === norm(address)) return 'owner';
  }catch(e){}
  try{
    const isHh = await state.market.isRegistered(address);
    if(isHh) return 'household';
  }catch(e){}
  return 'unknown';
}

function wireSignerContracts(){
  const marketAddr = document.getElementById('cfgMarket')?.value?.trim();
  const oracleAddr = document.getElementById('cfgOracle')?.value?.trim();
  const batteryAddr = document.getElementById('cfgBattery')?.value?.trim();
  if(state.market) state.marketWithSigner = new ethers.Contract(state.market.target, MARKET_ABI, state.signer);
  if(state.oracle) state.oracleWithSigner = new ethers.Contract(state.oracle.target, ORACLE_ABI, state.signer);
  if(state.battery) state.batteryWithSigner = new ethers.Contract(state.battery.target, BATTERY_ABI, state.signer);
}

async function loginWithWallet(){
  if(!window.ethereum){ document.getElementById('loginError').innerHTML = '<div class="err">Kein Browser-Wallet (z.B. MetaMask) gefunden.</div>'; return; }
  const btn = document.getElementById('btnWalletLogin');
  btn.disabled = true; btn.textContent = 'Verbinde…';
  document.getElementById('loginError').innerHTML = '<div class="empty">Warte auf Bestätigung im Wallet…</div>';
  try{
    const bp = new ethers.BrowserProvider(window.ethereum);
    await bp.send('eth_requestAccounts', []);
    state.signer = await bp.getSigner();
    state.myAddress = await state.signer.getAddress();
    wireSignerContracts();
    document.getElementById('loginError').innerHTML = '<div class="empty">Prüfe Rolle…</div>';
    state.role = await detectRole(state.myAddress);
    if(state.role === 'household') state.viewAddress = state.myAddress;
    renderSidebar(); renderMain();
  }catch(err){
    console.error(err);
    btn.disabled = false; btn.textContent = 'Mit Wallet verbinden';
    document.getElementById('loginError').innerHTML = `<div class="err">${err.shortMessage || err.message || err}</div>`;
  }
}

async function loginWithPrivateKey(pk){
  const btn = document.getElementById('btnPkLogin');
  if(!pk){ document.getElementById('loginError').innerHTML = '<div class="err">Bitte Private Key eingeben.</div>'; return; }
  btn.disabled = true; btn.textContent = 'Verbinde…';
  document.getElementById('loginError').innerHTML = '<div class="empty">Prüfe Key…</div>';
  try{
    const wallet = new ethers.Wallet(pk, state.provider);
    state.signer = wallet;
    state.myAddress = wallet.address;
    wireSignerContracts();
    document.getElementById('loginError').innerHTML = '<div class="empty">Prüfe Rolle…</div>';
    state.role = await detectRole(state.myAddress);
    if(state.role === 'household') state.viewAddress = state.myAddress;
    renderSidebar(); renderMain();
  }catch(err){
    console.error(err);
    btn.disabled = false; btn.textContent = 'Einloggen';
    document.getElementById('loginError').innerHTML = `<div class="err">Ungültiger Private Key: ${err.message||err}</div>`;
  }
}

function logout(){
  state.signer = null; state.myAddress = null; state.role = 'none';
  state.marketWithSigner = null; state.oracleWithSigner = null; state.batteryWithSigner = null;
  state.viewAddress = 'all'; state.page = 'overview';
  renderSidebar(); renderMain();
}

/* ════════════════════════════════════════════════════════════════
   DATEN-LAYER
   ════════════════════════════════════════════════════════════════ */
async function queryFilterChunked(contract, filter, fromBlock, toBlock, chunkSize=45000){
  let out = [];
  let start = fromBlock;
  while(start <= toBlock){
    const end = Math.min(start + chunkSize - 1, toBlock);
    const chunk = await contract.queryFilter(filter, start, end);
    out = out.concat(chunk);
    start = end + 1;
  }
  return out;
}

async function refreshAll(){
  const btn = document.getElementById('btnRefresh');
  if(btn){ btn.disabled = true; btn.textContent = 'Lädt…'; }
  try{
    await fetchAllLogs();
    renderSidebar();
    renderMain();
    const info = document.getElementById('lastFetchInfo');
    if(info) info.textContent = `Zuletzt: ${new Date().toLocaleTimeString('de-CH')} · ${state.households.length} HH · ${state.logs.meter.length} Meter · ${state.logs.trade.length} Trades · ${state.logs.battery.length} Batterie · ${state.logs.predictions.length} Prognosen`;
  }catch(err){
    console.error(err);
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = '↻ Aktualisieren'; }
  }
}

async function fetchAllLogs(){
  const fromBlock = parseInt(document.getElementById('cfgFromBlock')?.value || '0', 10) || 0;
  const toBlock = await state.provider.getBlockNumber();

  state.households = await state.market.getAllHouseholds();
  state.batteryHouseholds = state.battery ? await state.battery.getManagedHouseholds() : [];

  const queries = [
    queryFilterChunked(state.oracle, state.oracle.filters.MeterUpdated(), fromBlock, toBlock),
    queryFilterChunked(state.market, state.market.filters.EnergyTraded(), fromBlock, toBlock),
    queryFilterChunked(state.market, state.market.filters.SlotSettled(), fromBlock, toBlock),
    queryFilterChunked(state.oracle, state.oracle.filters.HouseholdRegistered(), fromBlock, toBlock),
    queryFilterChunked(state.oracle, state.oracle.filters.BatteryUpdated(), fromBlock, toBlock),
    state.battery ? queryFilterChunked(state.battery, state.battery.filters.DecisionMade(), fromBlock, toBlock) : Promise.resolve([]),
    state.incentive ? queryFilterChunked(state.incentive, state.incentive.filters.ActualSubmitted(), fromBlock, toBlock) : Promise.resolve([]),
    state.incentive ? queryFilterChunked(state.incentive, state.incentive.filters.ScoreUpdated(), fromBlock, toBlock) : Promise.resolve([]),
  ];
  const [meterRaw, tradeRaw, slotSettledRaw, oracleRegRaw, batteryRaw, decisionRaw, actualSubmittedRaw, scoreUpdatedRaw] = await Promise.all(queries);

  // ScoreUpdated trägt keine Slot-Nummer -> über denselben Block + Haushalt mit dem
  // zugehörigen ActualSubmitted-Event verknüpfen (beide werden in derselben Tx emittiert,
  // da _updateScoreForSlot() direkt aus submitActual() heraus aufgerufen wird).
  const actualByBlockHh = {};
  actualSubmittedRaw.forEach(l=>{ actualByBlockHh[`${l.blockNumber}_${norm(l.args.household)}`] = Number(l.args.slot); });
  const predictions = scoreUpdatedRaw.map(l=>{
    const key = `${l.blockNumber}_${norm(l.args.household)}`;
    return {
      household: l.args.household,
      newScore: Number(l.args.newScore),
      deviationPromille: Number(l.args.deviation),
      slot: actualByBlockHh[key] ?? null,
      blockNumber: l.blockNumber,
    };
  });

  state.logs = {
    meter: meterRaw.map(l=>({ household: l.args.household, slot: Number(l.args.slot), consumption: l.args.consumption, production: l.args.production, blockNumber: l.blockNumber })),
    trade: tradeRaw.map(l=>({ producer: l.args.producer, consumer: l.args.consumer, energyWh: l.args.energyWh, amountPaid: l.args.amountPaid, slot: Number(l.args.slot), blockNumber: l.blockNumber })),
    slotSettled: slotSettledRaw.map(l=>({ slot: Number(l.args.slot), totalEnergyTraded: l.args.totalEnergyTraded, totalPaid: l.args.totalPaid, blockNumber: l.blockNumber })),
    oracleRegistered: [...new Set(oracleRegRaw.map(l=>l.args.household))],
    battery: batteryRaw.map(l=>({ household: l.args.household, slot: Number(l.args.slot), soc: Number(l.args.soc), blockNumber: l.blockNumber })),
    decisions: decisionRaw.map(l=>({ household: l.args.household, amountWh: l.args.amountWh, slot: Number(l.args.slot), reason: l.args.reason, blockNumber: l.blockNumber })),
    predictions,
  };

  await fetchBlockTimestamps();
  const allTs = Object.values(state.blockTimestamps);
  state.firstBlockTs = allTs.length ? Math.min(...allTs) : null;
}

async function fetchBlockTimestamps(){
  const allBlocks = new Set([
    ...state.logs.meter.map(l=>l.blockNumber), ...state.logs.trade.map(l=>l.blockNumber),
    ...state.logs.slotSettled.map(l=>l.blockNumber), ...state.logs.battery.map(l=>l.blockNumber),
    ...state.logs.decisions.map(l=>l.blockNumber), ...state.logs.predictions.map(l=>l.blockNumber),
  ]);
  const toFetch = [...allBlocks].filter(b=> !(b in state.blockTimestamps));
  // Kein harter Deckel mehr (führte bei längeren Simulationen zu fehlenden Zeitangaben) —
  // stattdessen in Batches abrufen, um den RPC nicht mit tausenden Calls auf einmal zu treffen.
  const BATCH = 60;
  for(let i=0; i<toFetch.length; i+=BATCH){
    const batch = toFetch.slice(i, i+BATCH);
    const results = await Promise.all(batch.map(b=> state.provider.getBlock(b).catch(()=>null)));
    results.forEach((blk,j)=>{ if(blk) state.blockTimestamps[batch[j]] = blk.timestamp; });
  }
}
function blockTime(blockNumber){ return state.blockTimestamps[blockNumber] || null; }

  const el = document.getElementById('main');

}

/* ════════════════════════════════════════════════════════════════
   ENERGY-FLOW BERECHNUNG (pro Haushalt oder aggregiert)
   ════════════════════════════════════════════════════════════════ */
function computeEnergyFlow(scope){
  // scope: 'all' oder eine einzelne Adresse
  const isAll = scope === 'all';
  const inScope = (addr) => isAll || norm(addr) === norm(scope);

  const meterBySlot = {}; // slot -> {production, consumption}
  state.logs.meter.filter(m=>inScope(m.household)).forEach(m=>{
    if(!meterBySlot[m.slot]) meterBySlot[m.slot] = {production:0n, consumption:0n, block:m.blockNumber};
    meterBySlot[m.slot].production += BigInt(m.production);
    meterBySlot[m.slot].consumption += BigInt(m.consumption);
    meterBySlot[m.slot].block = Math.min(meterBySlot[m.slot].block, m.blockNumber);
  });

  const tradeBySlot = {}; // slot -> {bought, sold}
  state.logs.trade.forEach(t=>{
    const buyerInScope = inScope(t.consumer), sellerInScope = inScope(t.producer);
    if(!buyerInScope && !sellerInScope) return;
    if(!tradeBySlot[t.slot]) tradeBySlot[t.slot] = {bought:0n, sold:0n};
    if(buyerInScope) tradeBySlot[t.slot].bought += BigInt(t.energyWh);
    if(sellerInScope) tradeBySlot[t.slot].sold += BigInt(t.energyWh);
  });

  // Batterie-Delta pro Slot: bevorzugt aus DecisionMade (amountWh + Richtung via Netto-Vorzeichen),
  // sonst Fallback aus SoC-Differenz zwischen aufeinanderfolgenden BatteryUpdated-Events.
  const battBySlot = {}; // slot -> {charge, discharge} in Wh
  const decisionsInScope = state.logs.decisions.filter(d=>inScope(d.household));
  decisionsInScope.forEach(d=>{
    const m = meterBySlot[d.slot];
    const netto = m ? (m.production - m.consumption) : 0n;
    if(!battBySlot[d.slot]) battBySlot[d.slot] = {charge:0n, discharge:0n};
    if(netto > 0n) battBySlot[d.slot].charge += BigInt(d.amountWh);
    else if(netto < 0n) battBySlot[d.slot].discharge += BigInt(d.amountWh);
  });
  if(decisionsInScope.length === 0 && state.logs.battery.length > 0){
    // Fallback: SoC-Delta * (geschätzte Kapazität aus getBatteryStatus, falls verfügbar, sonst grobe Näherung ausgelassen)
    const relevant = isAll ? state.batteryHouseholds : state.batteryHouseholds.filter(a=>norm(a)===norm(scope));
    relevant.forEach(addr=>{
      const evs = state.logs.battery.filter(b=>norm(b.household)===norm(addr)).sort((a,b)=>a.slot-b.slot);
      for(let i=1;i<evs.length;i++){
        const diff = evs[i].soc - evs[i-1].soc; // Prozentpunkte, ohne Kapazität nur Richtung nutzbar
        if(diff===0) continue;
        if(!battBySlot[evs[i].slot]) battBySlot[evs[i].slot] = {charge:0n, discharge:0n};
        // Ohne Kapazitäts-Call hier nur Richtung, keine Wh-Menge -> als grobe Markierung mit 0 Wh weglassen.
      }
    });
  }

  const slots = Object.keys(meterBySlot).map(Number).sort((a,b)=>a-b);
  let result = slots.map(s=>{
    const m = meterBySlot[s];
    const production = Number(m.production), consumption = Number(m.consumption);
    const bought = Number((tradeBySlot[s]||{}).bought || 0n);
    const sold = Number((tradeBySlot[s]||{}).sold || 0n);
    const charge = Number((battBySlot[s]||{}).charge || 0n);
    const discharge = Number((battBySlot[s]||{}).discharge || 0n);

    const ownUse = Math.min(production, consumption);
    let remDeficit = Math.max(0, consumption - production);
    const coveredByBattery = Math.min(remDeficit, discharge);
    remDeficit -= coveredByBattery;
    const coveredByImport = Math.min(remDeficit, bought);
    const unmet = Math.max(0, remDeficit - coveredByImport);

    let remSurplus = Math.max(0, production - consumption);
    const toBattery = Math.min(remSurplus, charge);
    remSurplus -= toBattery;
    const toExport = Math.min(remSurplus, sold);
    const curtailed = Math.max(0, remSurplus - toExport);

    return { slot:s, block:m.block, production, consumption, ownUse, coveredByBattery, coveredByImport, unmet, toBattery, toExport, curtailed };
  });

  // Zeitraum-Filter — in SIMULIERTEN Tagen, nicht realen Kalendertagen: durch die
  // Zeitkompression (240 reale Sekunden = 1 Sim-Stunde) umfasst der gesamte Datensatz
  // oft nur wenige reale Stunden, selbst wenn er mehrere simulierte Tage abdeckt.
  // 1 Sim-Tag = 24 Sim-Stunden * 240 reale Sekunden = 5760 reale Sekunden.
  if(state.timeRangeDays !== 'all' && result.length > 0){
    const timestamps = result.map(f=>blockTime(f.block)).filter(Boolean);
    if(timestamps.length){
      const SIM_DAY_IN_REAL_SECONDS = 24 * REAL_SECONDS_PER_SIM_HOUR;
      const cutoff = Math.max(...timestamps) - Number(state.timeRangeDays) * SIM_DAY_IN_REAL_SECONDS;
      result = result.filter(f=>{ const t = blockTime(f.block); return t===null || t >= cutoff; });
    }
  }
  return result;
}

    try{ await renderPriceStatBox(scope); }catch(e){ console.error(e); document.getElementById('priceStatBox').innerHTML = `<div class="err">${e.message||e}</div>`; }
  }
  try{ await renderPaymentsBox(scope); }catch(e){ console.error(e); document.getElementById('paymentsBox').innerHTML = `<div class="err">${e.message||e}</div>`; }
  if(canApprove){
    try{ await renderApproveBox(); }catch(e){ console.error(e); document.getElementById('approveBox').innerHTML = `<div class="err">${e.message||e}</div>`; }
  }
}

async function renderKpis(scope){
  const isAll = scope === 'all';
  const flow = computeEnergyFlow(scope);
  const totalProd = flow.reduce((a,f)=>a+f.production,0);
  const totalCons = flow.reduce((a,f)=>a+f.consumption,0);
  const selfSuff = totalCons>0 ? (Math.min(totalProd,totalCons)/totalCons*100) : (totalProd>0?100:0);

  let saldo = 0;
  state.logs.trade.forEach(t=>{
    const p = norm(t.producer), c = norm(t.consumer);
    if(isAll || p===norm(scope)) saldo += Number(t.amountPaid)/1e6;
    if(isAll || c===norm(scope)) saldo -= Number(t.amountPaid)/1e6;
  });
  if(isAll) saldo = 0; // systemweit netto immer 0 (Geld fliesst nur intern um)

  document.getElementById('ovMeta').textContent = `${flow.length} Slots geladen`;
  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card"><div class="v">${fmtKwh(totalProd)}</div><div class="l">Produktion (kWh, gesamt)</div></div>
    <div class="kpi-card"><div class="v">${fmtKwh(totalCons)}</div><div class="l">Verbrauch (kWh, gesamt)</div></div>
    <div class="kpi-card"><div class="v">${selfSuff.toFixed(0)}%</div><div class="l">Selbstversorgung</div></div>
    ${isAll ? '' : `<div class="kpi-card"><div class="v ${saldo>=0?'ok':'warn'}">${saldo>=0?'+':''}${saldo.toFixed(3)}</div><div class="l">Saldo (Token)</div></div>`}
  `;
}

async function renderBatteryStatusBox(scope){
  const box = document.getElementById('battStatusBox');
  if(!state.battery){ box.innerHTML = '<div class="empty">Kein BatteryManager konfiguriert.</div>'; return; }
  const isAll = scope === 'all';
  const targets = isAll ? state.batteryHouseholds : state.batteryHouseholds.filter(a=>norm(a)===norm(scope));
  if(targets.length===0){ box.innerHTML = `<div class="empty">${isAll?'Keine Haushalte beim BatteryManager registriert.':'Dieser Haushalt hat keine Batterie.'}</div>`; return; }

  const [statuses, previews] = await Promise.all([
    Promise.all(targets.map(a=>state.battery.getBatteryStatus(a).catch(()=>null))),
    Promise.all(targets.map(a=>state.battery.previewAction(a).catch(()=>null))),
  ]);
  const lastNetto = {};
  targets.forEach(addr=>{
    const evs = state.logs.meter.filter(m=>norm(m.household)===norm(addr));
    if(evs.length===0){ lastNetto[addr]=0n; return; }
    const last = evs.reduce((a,b)=>a.blockNumber>b.blockNumber?a:b);
    lastNetto[addr] = BigInt(last.production)-BigInt(last.consumption);
  });

  const cards = targets.map((addr,i)=>{
    const st = statuses[i], pv = previews[i];
    if(!st) return `<div class="battery-card"><span class="addr-link">${addrLink(addr)}</span><div class="empty">Kein Status</div></div>`;
    const soc = Number(st.soc);
    const lvl = soc<20?'lvl-low':soc<60?'lvl-mid':'lvl-high';
    let trend='idle', reasonText='';
    if(pv && Number(pv.amountWh)>0){ trend = lastNetto[addr]>0n?'charge':lastNetto[addr]<0n?'discharge':'idle'; reasonText=pv.reason; }
    else if(pv){ reasonText = pv.reason; }
    const iconHtml = trend==='charge'?icon('zap',13):trend==='discharge'?icon('down',13):'';
    const label = trend==='charge'?`Lädt (+${fmtKwh(pv.amountWh)} kWh)`:trend==='discharge'?`Entlädt (-${fmtKwh(pv.amountWh)} kWh)`:'Ruht';
    return `<div class="battery-card">
      <span class="addr-link">${addrLink(addr)}</span>
      <div class="battery-shell">
        <div class="battery-bolt ${trend!=='idle'?'show-'+trend:''}">${iconHtml}</div>
        <div class="battery-fill ${lvl} ${trend==='charge'?'charging':''}" style="height:${Math.max(2,Math.min(100,soc))}%"></div>
        <div class="battery-pct">${soc}%</div>
      </div>
      <div class="battery-status-label ${trend}">${label}</div>
      ${reasonText?`<div class="battery-status-label" style="font-style:italic;margin-top:2px;">${reasonText}</div>`:''}
      <div class="battery-meta-row"><span>${fmtKwh(st.capacity)} kWh</span><span>Reserve ${Number(st.reserveSoc)}%</span></div>
      <div class="battery-meta-row"><span>Σ +${fmtKwh(st.charged)}</span><span>Σ -${fmtKwh(st.discharged)}</span></div>
    </div>`;
  }).join('');
  box.innerHTML = `<div class="battery-grid">${cards}</div>`;
}

async function renderLedgerSection(scope){
  const isAll = scope === 'all';
  const box = document.getElementById('ledgerSection');
  if(!isAll){
    const flow = computeEnergyFlow(scope);
    const totalProd = flow.reduce((a,f)=>a+f.production,0), totalCons = flow.reduce((a,f)=>a+f.consumption,0);
    box.innerHTML = `<h2>${icon('chart')} Selbstversorgung & Saldo</h2><div class="desc">Bereits oben als KPI zusammengefasst — Produktion ${fmtKwh(totalProd)} kWh, Verbrauch ${fmtKwh(totalCons)} kWh.</div>`;
    return;
  }
  const stats = {};
  state.households.forEach(a=> stats[norm(a)] = {produced:0n, consumed:0n, earned:0n, paid:0n});
  state.logs.meter.forEach(m=>{ const k=norm(m.household); if(!stats[k]) return; stats[k].produced+=BigInt(m.production); stats[k].consumed+=BigInt(m.consumption); });
  state.logs.trade.forEach(t=>{ const p=norm(t.producer), c=norm(t.consumer); if(stats[p]){stats[p].earned+=BigInt(t.amountPaid);} if(stats[c]){stats[c].paid+=BigInt(t.amountPaid);} });

  const rows = Object.entries(stats).map(([addr,s])=>{
    const selfSuff = s.consumed>0n ? (Number(s.produced<s.consumed?s.produced:s.consumed)/Number(s.consumed))*100 : (s.produced>0n?100:0);
    const saldo = Number(s.earned-s.paid)/1e6;
    return `<tr><td class="addr">${addrLink(addr)}</td><td>${fmtKwh(s.produced)}</td><td>${fmtKwh(s.consumed)}</td><td>${selfSuff.toFixed(0)}%</td>
      <td style="color:${saldo>=0?'var(--produce)':'var(--warn)'}">${saldo>=0?'+':''}${saldo.toFixed(3)}</td></tr>`;
  }).join('');
  box.innerHTML = `<h2>${icon('chart')} Selbstversorgung & Saldo</h2><div class="scroll-y"><table><thead><tr><th>Haushalt</th><th>Produziert</th><th>Verbraucht</th><th>Selbstvers.</th><th>Saldo</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ════════════════════════════════════════════════════════════════
   PROGNOSE-STATISTIK (Prediction vs. Realität) — nur Einzelhaushalt
   Quelle: IncentiveController.ScoreUpdated-Events (deviation bereits
   on-chain berechnet, siehe _calculateDeviation() im Contract) —
   verknüpft mit ActualSubmitted für die Slot-Nummer.
   ════════════════════════════════════════════════════════════════ */
async function renderPredictionBox(scope){
  const box = document.getElementById('predictionBox');
  if(!state.incentive){ box.innerHTML = '<div class="empty">Kein IncentiveController konfiguriert.</div>'; return; }
  const points = state.logs.predictions.filter(p=>norm(p.household)===norm(scope)).sort((a,b)=>a.blockNumber-b.blockNumber);
  if(points.length===0){ box.innerHTML = '<div class="empty">Noch keine bewerteten Prognosen für diesen Haushalt (ForecastSubmitted + ActualSubmitted nötig).</div>'; return; }

  const avgDeviation = points.reduce((a,p)=>a+p.deviationPromille,0) / points.length;
  const latestScore = points[points.length-1].newScore;
  let multiplierNote = '';
  try{
    const mult = Number(await state.incentive.getPriceMultiplier(scope));
    const pct = ((mult - INCENTIVE_BASE_MULTIPLIER) / INCENTIVE_BASE_MULTIPLIER * 100);
    multiplierNote = `<div class="kpi-card"><div class="v ${pct<=0?'ok':'warn'}">${pct>0?'+':''}${pct.toFixed(1)}%</div><div class="l">Aktueller Preisaufschlag/-rabatt</div></div>`;
  }catch(e){}

  box.innerHTML = `
    <div class="kpi-row" style="margin-bottom:14px;">
      <div class="kpi-card"><div class="v">${latestScore}</div><div class="l">Reputationsscore (0-1000)</div></div>
      <div class="kpi-card"><div class="v">${(avgDeviation/10).toFixed(1)}%</div><div class="l">Ø Abweichung Prognose↔Ist</div></div>
      ${multiplierNote}
    </div>
    <canvas id="predictionChart" height="90"></canvas>
    <div class="desc" style="margin-top:8px;">Abweichung in % vom prognostizierten Verbrauch (Balken, linke Achse) und Reputationsscore-Verlauf (Linie, rechte Achse). Bewertet wird laut Contract nur der Verbrauch, nicht die PV-Erzeugung.</div>`;

  if(state.charts.prediction) state.charts.prediction.destroy();
  state.charts.prediction = new Chart(document.getElementById('predictionChart'), {
    type:'bar',
    data:{ labels: points.map(p=>simTimeLabel(blockTime(p.blockNumber))), datasets:[
      { type:'bar', label:'Abweichung (%)', data:points.map(p=>p.deviationPromille/10), backgroundColor:'#E2A339', yAxisID:'y' },
      { type:'line', label:'Reputationsscore', data:points.map(p=>p.newScore), borderColor:'#5B8DEF', backgroundColor:'#5B8DEF', tension:.3, pointRadius:2, yAxisID:'y1' },
    ]},
    options:{ responsive:true, plugins:{ legend:{labels:{color:'#8B98A0'}},
      tooltip:{ callbacks:{ afterTitle:(items)=>{ const p=points[items[0].dataIndex]; return p.slot!==null ? `Slot ${p.slot}` : ''; } } } },
      scales:{
        x:{ title:{display:true,text:'Simulierte Zeit',color:'#5B666D'}, ticks:{color:'#5B666D',maxRotation:0,autoSkip:true}, grid:{display:false} },
        y:{ position:'left', title:{display:true,text:'Abweichung (%)',color:'#5B666D'}, ticks:{color:'#5B666D'}, grid:{color:'rgba(255,255,255,.04)'} },
        y1:{ position:'right', min:0, max:1000, title:{display:true,text:'Score',color:'#5B666D'}, ticks:{color:'#5B666D'}, grid:{display:false} },
      }
    }
  });
}

/* ════════════════════════════════════════════════════════════════
   Ø STROMPREIS — nur Einzelhaushalt

   Vergleich zum aktuellen Basispreis und Incentive-Multiplikator.

async function renderPriceStatBox(scope){
  const box = document.getElementById('priceStatBox');

  if(purchases.length===0){ box.innerHTML = '<div class="empty">Dieser Haushalt hat noch keine Energie zugekauft.</div>'; return; }

  const totalWh = purchases.reduce((a,t)=>a+Number(t.energyWh),0);
  const totalPaid = purchases.reduce((a,t)=>a+Number(t.amountPaid),0);
  const avgPricePerKwh = totalWh>0 ? (totalPaid/1e6) / (totalWh/1000) : 0;

  let basePriceNote = '', multNote = '';
  try{
    const basePrice = Number(await state.market.energyPricePerKwh())/1e6;
    basePriceNote = `<div class="kpi-card"><div class="v">${basePrice.toFixed(4)}</div><div class="l">Aktueller Basispreis (Token/kWh)</div></div>`;
  }catch(e){}
  if(state.incentive){
    try{
      const mult = Number(await state.incentive.getPriceMultiplier(scope));
      multNote = `<div class="kpi-card"><div class="v">${(mult/1000).toFixed(2)}×</div><div class="l">Aktueller Preis-Multiplikator</div></div>`;
    }catch(e){}
  }

  box.innerHTML = `
    <div class="kpi-row">
      <div class="kpi-card"><div class="v">${avgPricePerKwh.toFixed(4)}</div><div class="l">Ø bezahlter Preis (Token/kWh)</div></div>
      ${basePriceNote}
      ${multNote}
    </div>
    <div class="desc" style="margin-top:10px;">Auf Basis von ${purchases.length} Zukäufen (${fmtKwh(totalWh)} kWh gesamt, ${fmtToken(totalPaid)} Token gesamt).</div>`;
}

async function renderOracleHealth(){
  const box = document.getElementById('mgmtOracleHealth');
  const currentSlot = Number(await state.oracle.getCurrentSlot());
  const meterLogs = state.logs.meter;
  if(meterLogs.length===0){ box.innerHTML = `<div class="stat-row"><div class="kpi-card"><div class="v">${currentSlot}</div><div class="l">Aktueller Slot</div></div></div><div class="empty">Keine MeterUpdated-Events.</div>`; return; }
  const last = meterLogs.reduce((a,b)=>a.blockNumber>b.blockNumber?a:b);
  const [lastBlock, latestBlock] = await Promise.all([state.provider.getBlock(last.blockNumber), state.provider.getBlock('latest')]);
  const secsSince = latestBlock.timestamp - lastBlock.timestamp;
  const slotGap = currentSlot - last.slot;
  const statusClass = slotGap<=2?'ok':'warn';
  const statusLabel = slotGap<=2?'OK':slotGap<=10?'VERZÖGERT':'HÄNGT';
  box.innerHTML = `<div class="kpi-row">
    <div class="kpi-card"><div class="v">${currentSlot}</div><div class="l">Aktueller Slot</div></div>
    <div class="kpi-card"><div class="v">${last.slot}</div><div class="l">Letzter geschriebener Slot</div></div>
    <div class="kpi-card"><div class="v ${statusClass}">${statusLabel}</div><div class="l">Gap: ${slotGap}</div></div>
    <div class="kpi-card"><div class="v">${secsSince}s</div><div class="l">Seit letztem Update</div></div>
  </div>`;
}

async function renderReconcile(){
  const box = document.getElementById('mgmtReconcile');
  const oracleSet = new Set(state.logs.oracleRegistered.map(a=>norm(a)));
  const marketSet = new Set(state.households.map(a=>norm(a)));
  const batterySet = new Set(state.batteryHouseholds.map(a=>norm(a)));
  const all = [...new Set([...oracleSet, ...marketSet, ...batterySet])];
  if(all.length===0){ box.innerHTML = '<div class="empty">Keine Registrierungen.</div>'; return; }
  const showBattery = !!state.battery;
  const rows = all.map(a=>{
    const inO=oracleSet.has(a), inM=marketSet.has(a), inB=batterySet.has(a);
    const mismatch = inO!==inM;
    return `<tr style="${mismatch?'background:rgba(225,87,63,.06)':''}"><td class="addr">${addrLink(a)}</td>
      <td><span class="tag ${inO?'yes':'no'}">${inO?'ja':'nein'}</span></td>
      <td><span class="tag ${inM?'yes':'no'}">${inM?'ja':'nein'}</span></td>
      ${showBattery?`<td><span class="tag ${inB?'yes':'no'}">${inB?'ja':'nein'}</span></td>`:''}</tr>`;
  }).join('');
  box.innerHTML = `<div class="scroll-y"><table><thead><tr><th>Adresse</th><th>Oracle</th><th>Market</th>${showBattery?'<th>Battery</th>':''}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

async function renderAdminPanel(){
  const box = document.getElementById('mgmtAdmin');
  if(!state.marketWithSigner){ box.innerHTML = '<div class="empty">Nicht verbunden.</div>'; return; }

  box.innerHTML = `
    <div class="admin-block">
      <p>Oracle-Wallet im OracleStorage autorisieren.</p>
      <div class="row"><input id="authOracleInput" placeholder="0x... (Oracle-Wallet)" ${state.oracleWithSigner?'':'disabled'}><button id="btnAuthOracle" ${state.oracleWithSigner?'':'disabled'}>Autorisieren</button></div>
      <div id="authOracleResult"></div>
    </div>
    <div class="admin-block">
      <p>Haushalt im Market registrieren.</p>
      <div class="row"><input id="regInput" placeholder="0x... (Haushalt)"><button id="btnReg">Registrieren</button></div>
      <div id="regResult"></div>
    </div>
    <div class="admin-block">
      <p>Haushalt beim BatteryManager registrieren.</p>
      <div class="row"><input id="regBmHhInput" placeholder="0x... (Haushalt)" ${state.batteryWithSigner?'':'disabled'}><button id="btnRegBmHh" ${state.batteryWithSigner?'':'disabled'}>Registrieren</button></div>
      <div id="regBmHhResult"></div>
    </div>
    <div class="admin-block">
      <p>BatteryManager-Contract im Market eintragen.</p>
      <div class="row"><input id="regBatInput" placeholder="0x... (BatteryManager)"><button id="btnRegBat">Registrieren</button></div>
      <div id="regBatResult"></div>
    </div>
    <div class="admin-block">
      <p>IncentiveController-Contract im Market eintragen.</p>
      <div class="row"><input id="regICInput" placeholder="0x... (IncentiveController)"><button id="btnRegIC">Registrieren</button></div>
      <div id="regICResult"></div>
    </div>
    <div class="admin-block">
      <p>Aktuellen Slot abrechnen (kein Owner nötig).</p>
      <div class="row"><button id="btnSettle">Slot abrechnen</button></div>
      <div id="settleResult"></div>
    </div>
    <div class="admin-block">
      <p>Energiepreis pro kWh setzen (Token-Einheiten, 6 Decimals).</p>
      <div class="row"><input id="priceInput" type="number" placeholder="z.B. 100000"><button id="btnPrice">Setzen</button></div>
      <div id="priceResult"></div>
    </div>`;

  document.getElementById('btnAuthOracle').addEventListener('click', ()=>{ const v=document.getElementById('authOracleInput').value.trim(); if(v) runTx(state.oracleWithSigner.authorizeOracle(v), 'authOracleResult'); });
  document.getElementById('btnReg').addEventListener('click', ()=>{ const v=document.getElementById('regInput').value.trim(); if(v) runTx(state.marketWithSigner.registerHousehold(v), 'regResult'); });
  document.getElementById('btnRegBmHh').addEventListener('click', ()=>{ const v=document.getElementById('regBmHhInput').value.trim(); if(v && state.batteryWithSigner) runTx(state.batteryWithSigner.addHousehold(v), 'regBmHhResult'); });
  document.getElementById('btnRegBat').addEventListener('click', ()=>{ const v=document.getElementById('regBatInput').value.trim(); if(v) runTx(state.marketWithSigner.setBatteryManager(v), 'regBatResult'); });
  document.getElementById('btnRegIC').addEventListener('click', ()=>{ const v=document.getElementById('regICInput').value.trim(); if(v) runTx(state.marketWithSigner.setIncentiveController(v), 'regICResult'); });
  document.getElementById('btnSettle').addEventListener('click', ()=> runTx(state.marketWithSigner.settleSlot(), 'settleResult'));
  document.getElementById('btnPrice').addEventListener('click', ()=>{ const v=document.getElementById('priceInput').value.trim(); if(v) runTx(state.marketWithSigner.setEnergyPrice(BigInt(v)), 'priceResult'); });
}

/* ════════════════════════════════════════════════════════════════
   TX HELPER
   ════════════════════════════════════════════════════════════════ */
async function runTx(txPromise, resultId){
  const el = document.getElementById(resultId);
  el.innerHTML = '<div class="empty">Transaktion wird gesendet…</div>';
  try{
    const tx = await txPromise;
    el.innerHTML = `<div class="empty">Warte auf Bestätigung… <a class="addr-link" href="https://sepolia.etherscan.io/tx/${tx.hash}" target="_blank" rel="noopener">${short(tx.hash)}</a></div>`;
    const receipt = await tx.wait();
    el.innerHTML = `<div class="ok-msg">Erfolgreich · Block ${receipt.blockNumber} · <a class="addr-link" href="https://sepolia.etherscan.io/tx/${tx.hash}" target="_blank" rel="noopener">${short(tx.hash)}</a></div>`;
    await refreshAll();
  }catch(err){
    console.error(err);
    el.innerHTML = `<div class="err">${err.shortMessage || err.reason || err.message || err}</div>`;
  }
}

/* ════════════════════════════════════════════════════════════════
   INIT
   ════════════════════════════════════════════════════════════════ */
renderSidebar();
renderMain();
</script>
